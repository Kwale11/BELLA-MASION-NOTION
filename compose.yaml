name: bella-maison

services:
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./back_end/src/main/resources/db/migration/V1__create_tables.sql:/docker-entrypoint-initdb.d/01-create-tables.sql:ro
      - ./back_end/src/main/resources/db/migration/V2__seed_products.sql:/docker-entrypoint-initdb.d/02-seed-products.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}"
          -e "SELECT 1 FROM catalog_products LIMIT 1;
          SELECT 1 FROM customization_designs LIMIT 1;"
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    image: bella-maison-backend:local
    build:
      context: ./back_end
    restart: unless-stopped
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE}?sslMode=DISABLED&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_SQL_INIT_MODE: never
      FRONTEND_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: bella-maison-frontend:local
    build:
      context: ./front_end
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data: